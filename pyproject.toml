[project]
name = "tenders"
version = "0.1.0"
description = "Tender-response application: API, worker and pipelines."
readme = "backend/README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=1.8",
  "openai>=1.50",
  "voyageai>=0.3",
  "docling>=2.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "pgserver>=0.1.4",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning:pgserver"]
markers = [
  "integration: exercises another module end to end; skipped when it cannot be imported",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "frontend", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
